name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:css
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eneba
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/eneba?sslmode=disable
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/eneba?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seed and start the API
        working-directory: api
        run: |
          go run ./cmd/seed
          go build -o bin/server ./cmd/server
          ./bin/server > ../api.log 2>&1 &
      - name: Start the web app
        working-directory: web
        run: |
          npm ci
          npx vite --port 5173 --strictPort > ../web.log 2>&1 &
      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do curl -sf localhost:5173/api/healthz && exit 0; sleep 2; done
          cat api.log web.log; exit 1
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            api.log
            web.log

  transcript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transcript files are present and linked
        run: |
          test -s docs/agent-chat-history.md
          # Only real markdown links: path characters exclude brackets, so quoted regexes don't count.
          grep -oE '\]\(agent-chat-history/[A-Za-z0-9._/-]+\)' docs/agent-chat-history.md | sed 's/^](//; s/)$//' | sort -u > links.txt
          test -s links.txt
          while read f; do test -f "docs/$f" || { echo "missing $f"; exit 1; }; done < links.txt
          echo "$(wc -l < links.txt) linked files present"
